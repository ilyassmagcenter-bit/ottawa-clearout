nt. Les taxes et besoins particuliers sont précisés à l’avance.'],['Comment fonctionne la garantie de 24 à 48 heures?','Une fois votre réservation acceptée et confirmée, la collecte est prévue dans les 24 à 48 heures, avec un créneau d’arrivée de deux heures. Le calculateur ne confirme pas de réservation.'],['Quels objets sont exclus?','Les produits dangereux, chimiques, peintures, l’amiante et les autres déchets réglementés nécessitent une filière spécialisée. Les débris de construction lourds et objets inhabituels font l’objet d’une évaluation.'],['Le service est-il offert en français?','Oui. Le service est offert en français et en anglais à Ottawa et à Gatineau.']]}};
let lang=localStorage.getItem('clearout-lang')||'en', selected=1;const ranges=[[99,119],[199,229],[349,399],[499,549],[599,649]];
function render(){const c=copy[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=c[e.dataset.t]);document.getElementById('lang').textContent=lang==='en'?'FR':'EN';document.getElementById('lang').ariaLabel=lang==='en'?'Passer en français':'Switch to English';document.querySelector('.visual img').alt=lang==='en'?'Junk removal worker loading broken furniture, scrap wood and discarded carpet into a cargo van':'Chargement de meubles abîmés, de bois et de vieux tapis dans une camionnette de débarras';document.getElementById('loads').innerHTML=c.loads.map((v,i)=>`<button class="load ${selected===i?'active':''}" aria-pressed="${selected===i}" data-load="${i}"><span class="truck">${[0,1,2,3].map(j=>`<i class="${j<Math.max(1,i)?'fill':''}"></i>`).join('')}</span>${v}</button>`).join('');let a=document.getElementById('access'),val=a.selectedIndex;a.innerHTML=c.accessOptions.map(v=>`<option>${v}</option>`).join('');a.selectedIndex=Math.max(0,val);document.getElementById('servicecards').innerHTML=c.services.map(s=>`<article class="service"><div class="icon">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></article>`).join('');document.getElementById('process').innerHTML=c.steps.map((s,i)=>`<article><div class="num">0${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('');document.getElementById('faqs').innerHTML=c.faqs.map(s=>`<details><summary>${s[0]}</summary><p>${s[1]}</p></details>`).join('');update();}
function update(){const custom=document.getElementById('access').selectedIndex===2;document.getElementById('price').textContent=custom?(lang==='en'?'Custom quote':'Sur mesure'):`$${ranges[selected][0]}–$${ranges[selected][1]}`;document.getElementById('result').hidden=true;}
document.getElementById('loads').onclick=e=>{let b=e.target.closest('[data-load]');if(b){selected=Number(b.dataset.load);render();}};document.getElementById('access').onchange=update;document.getElementById('lang').onclick=()=>{lang=lang==='en'?'fr':'en';localStorage.setItem('clearout-lang',lang);render()};document.getElementById('summary').onclick=()=>{let c=copy[lang];const content=['OTTAWA CLEAROUT',c.estimateLabel+': '+document.getElementById('price').textContent+' CAD',c.loads[selected],document.getElementById('city').value,document.getElementById('access').value,c.tax,c.bookingNote].join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download=lang==='en'?'ottawa-clearout-estimate.txt':'ottawa-clearout-estimation.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);const r=document.getElementById('result');r.hidden=false;r.textContent=lang==='en'?'Your estimate has been downloaded. No pickup has been reserved.':'Votre estimation a été téléchargée. Aucune collecte n’a été réservée.';};render();
</script></body></html>
